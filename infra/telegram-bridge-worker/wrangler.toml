name = "escapebook-tg-bridge"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "escapebook-db"
database_id = "add53d51-046d-41b2-95bb-272610cb2814"

[vars]
# Не секрет: ID группы/канала Telegram, куда пересылаются ВСЕ сообщения из Discord.
# Значение НЕ хранится в репозитории: GitHub Actions подставляет его из
# repository secret `TG_CHAT_ID` при деплое (см. шаг "Inject route config").
# Формат: -1001234567890 (супергруппа). Пусто -> /bridge/ds-to-tg вернёт
# {"ok":false,"reason":"tg_chat_id_not_configured"}.
TG_CHAT_ID = "-1004439376746"

# DISCORD_CHANNEL_ID намеренно НЕ объявлен здесь: он хранится как Secret
# (Dashboard -> Settings -> Variables and Secrets), секреты деплой не затирает.
# Если задать его как Variable в Dashboard, следующий `wrangler deploy`
# перезапишет его пустым значением из [vars].

# Secrets (set via Cloudflare Dashboard: Workers -> escapebook-tg-bridge -> Settings -> Variables and Secrets):
# - TG_BOT_TOKEN       : Bot API token (отправка в Telegram, getFile для медиа)
# - TG_WEBHOOK_SECRET  : секрет вебхука Telegram
# - DS_BOT_TOKEN       : Discord bot token (REST API: отправка сообщений/файлов в канал)
# - DISCORD_CHANNEL_ID : (Secret!) ID канала Discord для TG -> DS
# - BRIDGE_SECRET      : (опционально) общий секрет /bridge/ds-to-tg
