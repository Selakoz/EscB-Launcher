name = "escapebook-skins"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Worker-to-Worker calls must not use the public workers.dev hostname: both
# workers live on the same *.workers.dev zone, and Cloudflare answers such
# same-zone subrequests with a 404 before they ever reach the auth worker.
# The service binding routes the call internally instead.
[[services]]
binding = "AUTH"
service = "escapebook-auth"

[[d1_databases]]
binding = "DB"
database_name = "escapebook-db"
database_id = "add53d51-046d-41b2-95bb-272610cb2814"

[vars]
# Fallback base URL used only when the AUTH service binding is unavailable
# (e.g. `wrangler dev` without the auth worker running locally).
# In production the service binding above is used and this value is ignored.
AUTH_WORKER_URL = "https://escapebook-auth.fireman777sasha.workers.dev"
