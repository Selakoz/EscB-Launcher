name: Deploy escapebook-tg-bridge

on:
  push:
    branches: [main]
    paths:
      - "infra/telegram-bridge-worker/**"
      - ".github/workflows/deploy-tg-bridge.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/telegram-bridge-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: infra/telegram-bridge-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # Database/route IDs are not stored in the repository: inject them from
      # repository secrets before deploying (deploy overwrites Dashboard vars).
      - name: Inject route config
        env:
          TG_CHAT_ID_SECRET: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "$TG_CHAT_ID_SECRET" ]; then
            echo "::error::Repository secret TG_CHAT_ID is not set (see GITHUB_SETUP.md)."
            exit 1
          fi
          sed -i "s|TG_CHAT_ID = \"\"|TG_CHAT_ID = \"$TG_CHAT_ID_SECRET\"|" wrangler.toml
          grep -q "TG_CHAT_ID = \"$TG_CHAT_ID_SECRET\"" wrangler.toml

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: infra/telegram-bridge-worker
          command: deploy
