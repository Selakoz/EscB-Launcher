name: D1 Migrations

on:
  workflow_dispatch:
  push:
    paths:
      - "infra/shared/schema.sql"
      - "infra/shared/migrations/**"
      - ".github/workflows/d1-migrate.yml"

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/auth-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Apply schema (idempotent CREATE TABLE IF NOT EXISTS)
        run: npx wrangler d1 execute escapebook-db --remote --file=../shared/schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
